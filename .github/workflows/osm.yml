name: Caminos de OpenStreetMap
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths: ["tools/osm_tiles_pbf.py", ".github/workflows/osm.yml"]
permissions:
  contents: write
  statuses: write
concurrency:
  group: osm
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install -q osmium
      - name: Teselas desde el extracto de Geofabrik
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=pending -f context=osm -f description="descargando el extracto de Cataluña" > /dev/null || true
          python tools/osm_tiles_pbf.py | tee log.txt
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=success -f context=osm -f description="$(tail -1 log.txt | cut -c1-139)" > /dev/null || true
      - name: Publicar en main y gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git commit -q -m "Caminos de OpenStreetMap actualizados ($(date +%Y-%m-%d))" || exit 0
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          git push -q --force origin HEAD:gh-pages
      - name: Si falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=failure -f context=osm -f description="falló: mira el registro" > /dev/null || true
